<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produit | Keur Yaye Rokhaya</title>
  <meta name="description" content="Fiche produit Keur Yaye Rokhaya : prix, options et commande sur WhatsApp. Boutique à Dakar, livraison partout au Sénégal.">
  <link rel="canonical" href="https://keuryayerokhaya.com/produit.html">
  <meta property="og:image" content="https://keuryayerokhaya.com/og-image.jpg">
  <meta property="og:site_name" content="Keur Yaye Rokhaya">
  <meta name="theme-color" content="#8419CB">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-grid">
    <a class="brand" href="index.html"><img src="logo.png" alt="" width="30" height="36">Keur Yaye Rokhaya</a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="index.html#nos-produits">Boutique</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#epargne">Coffre Épargne</a>
      <a href="index.html#a-propos">À propos</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a class="btn btn-small" href="#" data-wa="Bonjour, je souhaite commander un produit chez Keur Yaye Rokhaya.">Commander</a>
  </div>
</header>
<main class="product-page">
  <div class="wrap" id="page">
    <a class="back" href="index.html#nos-produits">Retour à la boutique</a>
    <div id="contenu"></div>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© 2026 Keur Yaye Rokhaya</p>
    <nav aria-label="Informations légales">
      <a href="cgu.html">Conditions d’utilisation</a>
      <a href="confidentialite.html">Confidentialité</a>
    </nav>
    <p class="credit">Site conçu par Sultan Agency</p>
  </div>
</footer>
<script src="products.js" charset="utf-8"></script>
<script src="site.js"></script>
<script src="shop.js"></script>
<script>
(function () {
  var contenu = document.getElementById("contenu");
  var slug = new URLSearchParams(location.search).get("p");
  var produits = Array.isArray(window.PRODUCTS) ? window.PRODUCTS : [];
  var p = produits.filter(function (x) { return KYR.slug(x.nom) === slug; })[0];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }
  function prixTexte(v) {
    return (typeof v === "number" && v > 0) ? v.toLocaleString("fr-FR") + " FCFA" : "Sur devis";
  }

  if (!p) {
    contenu.appendChild(el("h1", "", "Produit introuvable"));
    var lien = el("a", "btn", "Voir la boutique");
    lien.href = "index.html#nos-produits";
    lien.style.marginTop = "1rem";
    contenu.appendChild(lien);
    return;
  }
  document.title = p.nom + " | Keur Yaye Rokhaya";
  (function donneesPourGoogle() {
    var base = "https://keuryayerokhaya.com/";
    var url = base + "produit.html?p=" + KYR.slug(p.nom);
    var canon = document.querySelector('link[rel="canonical"]'); if (canon) canon.href = url;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.content = p.nom + " chez Keur Yaye Rokhaya à Dakar. " + (p.description || "") + " Commande sur WhatsApp, livraison partout au Sénégal.";
    var produit = { "@type": "Product", "name": p.nom, "category": p.categorie, "url": url };
    if (p.description) produit.description = p.description;
    if (p.image) produit.image = base + p.image;
    var marque = p.marque || ({ "iPhone": "Apple", "Apple Watch": "Apple", "Samsung": "Samsung", "Google Pixel": "Google" })[p.categorie];
    if (marque) produit.brand = { "@type": "Brand", "name": marque };
    var st = (p.options && p.options.stockages) || [];
    var prix = st.filter(function (x) { return typeof x === "object" && typeof x.prix === "number"; }).map(function (x) { return x.prix; });
    if (prix.length) produit.offers = { "@type": "AggregateOffer", "priceCurrency": "XOF", "lowPrice": Math.min.apply(null, prix), "highPrice": Math.max.apply(null, prix), "offerCount": prix.length };
    else if (typeof p.prix === "number" && p.prix > 0) produit.offers = { "@type": "Offer", "priceCurrency": "XOF", "price": p.prix, "url": url };
    var fil = { "@type": "BreadcrumbList", "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Accueil", "item": base },
      { "@type": "ListItem", "position": 2, "name": "Boutique", "item": base + "#nos-produits" },
      { "@type": "ListItem", "position": 3, "name": p.nom, "item": url } ] };
    var ld = document.createElement("script"); ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": [produit, fil] });
    document.head.appendChild(ld);
  })();

  var marque = p.marque || ({ "iPhone": "Apple", "Apple Watch": "Apple", "Samsung": "Samsung", "Google Pixel": "Google" })[p.categorie] || "";
  var opt = p.options || {};
  function nomStock(s) { return typeof s === "object" ? s.nom : s; }
  function prixStock(s) { return (typeof s === "object" && typeof s.prix === "number") ? s.prix : p.prix; }
  // capacité présélectionnée : la première qui a un prix (sinon la première de la liste)
  var iniStock = 0;
  if (opt.stockages) for (var is = 0; is < opt.stockages.length; is++) {
    if (typeof opt.stockages[is] === "object" && typeof opt.stockages[is].prix === "number") { iniStock = is; break; }
  }
  var choix = {
    couleur: opt.couleurs ? opt.couleurs[0].nom : "",
    stockage: opt.stockages ? nomStock(opt.stockages[iniStock]) : "",
    prix: p.prix,
    etat: opt.etats ? opt.etats[0] : null,
    sim: opt.sims ? opt.sims[0] : null
  };

  var grille = el("div", "product-grid");
  var media = el("div", "product-media");
  if (p.image) {
    var img = document.createElement("img");
    img.src = p.image; img.alt = p.nom;
    media.appendChild(img);
  } else { media.textContent = p.nom; }
  var majPastille = function () {};
  var photo = media.querySelector("img");
  if (opt.couleurs) {
    var pastille = el("span", "color-chip");
    var point = document.createElement("i");
    var nomCouleur = document.createElement("span");
    pastille.appendChild(point); pastille.appendChild(nomCouleur);
    media.appendChild(pastille);
    majPastille = function (c) {
      if (c.image) {
        if (photo) photo.src = c.image;
        point.style.background = c.hex; nomCouleur.textContent = c.nom;
        pastille.style.display = "";
      } else { pastille.style.display = "none"; }
    };
    majPastille(opt.couleurs[0]);
  }
  grille.appendChild(media);

  var info = el("div", "product-info");
  var pills = el("ul", "pill-row");
  var li1 = el("li", "pill", p.categorie); pills.appendChild(li1);
  if (marque) { var li2 = el("li", "pill pill-accent", marque); pills.appendChild(li2); }
  info.appendChild(pills);
  info.appendChild(el("h1", "", p.nom));
  // V2 : « Prix : » + valeur dynamique (prix de la capacité choisie, ou « Sur devis »)
  var prixEl = el("p", "product-price"); prixEl.setAttribute("aria-live", "polite");
  var prixV = el("span", "price-v", prixTexte(choix.prix));
  prixEl.appendChild(el("span", "price-k", "Prix :")); prixEl.appendChild(document.createTextNode(" ")); prixEl.appendChild(prixV);
  info.appendChild(prixEl);
  var devisNote = el("p", "quote-note", "Le prix de cette variante n’est pas affiché : il vous est donné sur demande, par WhatsApp."); devisNote.hidden = true;
  info.appendChild(devisNote);
  // V2 : rappel clair de la variante choisie (capacité, couleur, SIM, état)
  var resumeEl = el("p", "variant-summary"); resumeEl.setAttribute("aria-live", "polite");
  info.appendChild(resumeEl);

  var zoneOptions = el("div", "");
  zoneOptions.style.display = "grid"; zoneOptions.style.gap = "1.25rem";
  info.appendChild(zoneOptions);

  // ---- achat : quantité, panier, WhatsApp (numéro principal des commandes, défini dans site.js) ----
  var qte = 1;
  var bouton = el("a", "btn btn-wa btn-block", "Commander sur WhatsApp");
  bouton.target = "_blank"; bouton.rel = "noopener";
  // V2 : si la variante est « Sur devis », le bouton devient « Demander le prix sur WhatsApp »
  var devisBtn = el("a", "btn btn-wa btn-block", "Demander le prix sur WhatsApp");
  devisBtn.target = "_blank"; devisBtn.rel = "noopener"; devisBtn.hidden = true;
  var ajouterBtn = el("button", "btn btn-block", "Ajouter au panier"); ajouterBtn.type = "button";
  var totalEl = el("p", "total-line");
  var statut = el("p", "added"); statut.setAttribute("role", "status"); statut.hidden = true;

  function variante() {
    return { couleur: choix.couleur || "", stockage: choix.stockage || "", etat: choix.etat ? choix.etat.nom : "", sim: choix.sim ? choix.sim.nom : "" };
  }
  function majLien() {
    var v = variante(), unitaire = KYR.shop.prixDe(p, v.stockage);
    choix.prix = unitaire;
    prixV.textContent = KYR.shop.prixTexte(unitaire);
    prixEl.classList.toggle("is-quote", unitaire === null);
    devisNote.hidden = unitaire !== null;
    var resume = KYR.shop.resumeVariante(v);
    resumeEl.textContent = resume ? "Variante sélectionnée : " + resume : "";
    totalEl.textContent = unitaire === null ? "" : "Total : " + KYR.fcfa(unitaire * qte);
    totalEl.hidden = unitaire === null;
    bouton.href = KYR.lien(KYR.shop.messageProduit(p, v, qte));
    devisBtn.href = KYR.lien(KYR.shop.messageDevis(p, v));
    bouton.hidden = unitaire === null; devisBtn.hidden = unitaire !== null;
  }

  var pas = el("div", "qty-row");
  pas.appendChild(el("span", "qty-label", "Quantité"));
  var stepper = el("div", "stepper");
  var moins = el("button", "", "\u2212"); moins.type = "button"; moins.setAttribute("aria-label", "Diminuer la quantité");
  var sortie = document.createElement("output"); sortie.textContent = "1"; sortie.setAttribute("aria-live", "polite");
  var plus = el("button", "", "+"); plus.type = "button"; plus.setAttribute("aria-label", "Augmenter la quantité");
  function majQte(n) { qte = Math.max(1, Math.min(KYR.shop.MAX_QTE, n)); sortie.textContent = qte; moins.disabled = qte <= 1; plus.disabled = qte >= KYR.shop.MAX_QTE; majLien(); }
  moins.addEventListener("click", function () { majQte(qte - 1); });
  plus.addEventListener("click", function () { majQte(qte + 1); });
  stepper.appendChild(moins); stepper.appendChild(sortie); stepper.appendChild(plus); pas.appendChild(stepper);

  ajouterBtn.addEventListener("click", function () {
    var r = KYR.shop.ajouter(KYR.slug(p.nom), variante(), qte);
    statut.hidden = false; statut.textContent = "";
    if (r.ok) {
      statut.appendChild(document.createTextNode("Ajouté au panier (" + r.nombre + " article" + (r.nombre > 1 ? "s" : "") + " au total). "));
      var a = el("a", "", "Voir le panier"); a.href = "panier.html"; statut.appendChild(a);
    } else {
      statut.textContent = r.raison === "plein" ? "Le panier est plein (20 produits différents au maximum). Passez commande ou retirez un produit." : "Impossible d’ajouter ce produit.";
    }
  });

  function groupe(titre, construire) {
    var g = el("div", "opt-group");
    g.appendChild(el("h2", "", titre));
    var rang = el("div", "opt-row");
    construire(rang);
    g.appendChild(rang);
    zoneOptions.appendChild(g);
  }
  function activer(rang, bouton, sel) {
    Array.prototype.forEach.call(rang.children, function (b) { b.setAttribute("aria-pressed", b === bouton ? "true" : "false"); });
  }

  if (opt.couleurs) groupe("Couleur", function (rang) {
    opt.couleurs.forEach(function (c, i) {
      var b = el("button", "swatch"); b.type = "button";
      var pastille = document.createElement("i"); pastille.style.setProperty("--c", c.hex);
      b.appendChild(pastille); b.appendChild(el("span", "", c.nom));
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", function () { choix.couleur = c.nom; majPastille(c); activer(rang, b); majLien(); });
      rang.appendChild(b);
    });
  });
  if (opt.stockages) groupe("Capacité de stockage", function (rang) {
    opt.stockages.forEach(function (s, i) {
      var b = el("button", "pill-btn cap-btn"); b.type = "button";
      b.appendChild(document.createTextNode(nomStock(s)));
      if (KYR.aPrixParCapacite(p)) { var prc = KYR.shop.prixDe(p, nomStock(s)); b.appendChild(el("small", "", prc === null ? "Sur devis" : KYR.fcfa(prc))); }
      b.setAttribute("aria-pressed", i === iniStock ? "true" : "false");
      b.addEventListener("click", function () { choix.stockage = nomStock(s); activer(rang, b); majLien(); });
      rang.appendChild(b);
    });
  });
  if (opt.etats) groupe("État du produit", function (rang) {
    opt.etats.forEach(function (e, i) {
      var b = el("button", "pill-btn rond"); b.type = "button";
      b.appendChild(document.createTextNode(e.nom));
      if (e.detail) b.appendChild(el("small", "", e.detail));
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", function () { choix.etat = e; activer(rang, b); majLien(); });
      rang.appendChild(b);
    });
  });
  if (opt.sims) groupe("Type de SIM", function (rang) {
    opt.sims.forEach(function (s, i) {
      var b = el("button", "pill-btn rond"); b.type = "button";
      b.appendChild(document.createTextNode(s.nom));
      if (s.detail) b.appendChild(el("small", "", s.detail));
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", function () { choix.sim = s; activer(rang, b); majLien(); });
      rang.appendChild(b);
    });
  });

  if (opt.stockages) info.appendChild(el("p", "note", KYR.aPrixParCapacite(p) ? "Le prix change selon la capacité choisie. Il est confirmé sur WhatsApp avant toute commande." : "Le prix peut varier selon la capacité. Il est confirmé sur WhatsApp avant toute commande."));
  else info.appendChild(el("p", "note", "Le prix et la disponibilité sont confirmés sur WhatsApp avant toute commande."));
  var appelP = el("p", "call-line"); appelP.appendChild(document.createTextNode("Une question ? "));
  var appelA = el("a", "", "Appeler le magasin "); appelA.href = "tel:+" + KYR.telCommercial; appelA.appendChild(el("span", "nowrap", KYR.affiche(KYR.telCommercial))); appelP.appendChild(appelA);
  info.appendChild(pas); info.appendChild(totalEl); info.appendChild(ajouterBtn); info.appendChild(bouton); info.appendChild(devisBtn); info.appendChild(statut); info.appendChild(appelP);
  majQte(1);
  grille.appendChild(info);
  contenu.appendChild(grille);

  if (p.categorie === "iPhone") {
    var sol = el("section", "solutions");
    sol.appendChild(el("h2", "", "Options et solutions"));
    var liste = el("div", "solution-list");
    [
      ["Échanger ce produit", "Estimez votre iPhone actuel et changez rapidement.", "estimation.html?type=echange&nouveau=" + encodeURIComponent(p.nom)],
      ["Revendre votre iPhone", "Faites estimer l’iPhone que vous voulez vendre.", "estimation.html?type=vendre"],
      ["Payer en plusieurs tranches", "Épargnez et payez à votre rythme dans votre coffre.", "index.html#epargne"]
    ].forEach(function (s) {
      var a = el("a", "solution"); a.href = s[2];
      a.appendChild(el("strong", "", s[0])); a.appendChild(el("span", "", s[1]));
      liste.appendChild(a);
    });
    sol.appendChild(liste);
    contenu.appendChild(sol);
  }
  if (p.description) {
    var desc = el("section", "description");
    desc.appendChild(el("h2", "", "Description"));
    desc.appendChild(el("p", "", p.description));
    contenu.appendChild(desc);
  }
})();
</script>
</body>
</html>
