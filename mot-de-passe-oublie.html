<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mot de passe oublié — Keur Yaye Rokhaya</title>
  <meta name="description" content="Recevez un lien pour choisir un nouveau mot de passe.">
  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">
    <section class="auth-card">

      <a href="index.html" class="auth-logo">
        Keur Yaye Rokhaya
      </a>

      <h1>Mot de passe oublié</h1>

      <p class="auth-subtitle">
        Saisissez l'adresse e-mail de votre compte. Si elle correspond à un compte, vous recevrez un lien pour choisir un nouveau mot de passe.
      </p>

      <form id="oubli-form">

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" class="auth-submit">
          Envoyer le lien
        </button>

        <p id="oubli-message" class="auth-message" aria-live="polite"></p>

      </form>

      <div class="auth-links">
        <a href="connexion.html">Retour à la connexion</a>
      </div>

      <a href="index.html" class="auth-back">
        ← Retour à la boutique
      </a>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="mot-de-passe-oublie.js"></script>

</body>
</html>
