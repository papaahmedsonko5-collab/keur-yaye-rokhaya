<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer un compte — Keur Yaye Rokhaya</title>
  <meta name="description" content="Créez votre espace client Keur Yaye Rokhaya.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">
    <section class="auth-card">

      <a href="index.html" class="auth-logo">
        Keur Yaye Rokhaya
      </a>

      <h1>Créer un compte</h1>

      <p class="auth-subtitle">
        Créez votre espace client pour retrouver vos commandes et gérer votre compte.
      </p>

      <form id="inscription-form">

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <small>Minimum 8 caractères.</small>
        </div>

        <div class="form-group">
          <label for="password-confirm">Confirmer le mot de passe</label>
          <input
            type="password"
            id="password-confirm"
            name="password-confirm"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <label class="auth-checkbox">
          <input type="checkbox" id="privacy-consent" required>
          <span>
            J'accepte la
            <a href="confidentialite.html" target="_blank">
              politique de confidentialité
            </a>
            et les
            <a href="cgu.html" target="_blank">
              conditions générales d'utilisation
            </a>.
          </span>
        </label>

        <button type="submit" class="auth-submit">
          Créer mon compte
        </button>

        <p id="inscription-message" class="auth-message" aria-live="polite"></p>

      </form>

      <div class="auth-links">
        <span>Vous avez déjà un compte ?</span>
        <a href="connexion.html">Se connecter</a>
      </div>

      <a href="index.html" class="auth-back">
        ← Retour à la boutique
      </a>

    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="inscription.js"></script>

</body>
</html>
