<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion — Keur Yaye Rokhaya</title>
  <meta name="description" content="Connectez-vous à votre espace client Keur Yaye Rokhaya.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">
    <section class="auth-card">

      <a href="index.html" class="auth-logo">
        Keur Yaye Rokhaya
      </a>

      <h1>Connexion</h1>

      <p class="auth-subtitle">
        Connectez-vous à votre espace client.
      </p>

      <form id="connexion-form">

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="auth-submit">
          Se connecter
        </button>

        <p id="connexion-message" class="auth-message" aria-live="polite"></p>

      </form>

      <div class="auth-links">
        <a href="#" id="mot-de-passe-oublie">
          Mot de passe oublié ?
        </a>

        <span>·</span>

        <a href="inscription.html">
          Créer un compte
        </a>
      </div>

      <a href="index.html" class="auth-back">
        ← Retour à la boutique
      </a>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="connexion.js"></script>

</body>
</html>
