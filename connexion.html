<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion — Keur Yaye Rokhaya</title>

  <meta name="description" content="Connectez-vous à votre espace client Keur Yaye Rokhaya.">

  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="connexion.css">
</head>

<body class="page-connexion">

  <main class="auth-page">

    <section class="auth-card">

      <a href="index.html" class="auth-logo">
        <img src="logo.png" alt="" width="45" height="54">
        <span>Keur Yaye Rokhaya</span>
      </a>

      <h1>Content de vous <span class="connexion-accent">revoir</span></h1>

      <p class="auth-subtitle">
        Connectez-vous pour accéder à votre espace client.
      </p>

      <form id="connexion-form">

        <div class="form-group champ">

          <span class="champ-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
          </span>

          <label for="email">Adresse e-mail</label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            inputmode="email"
            placeholder="Entrez votre adresse e-mail"
            required
          >

        </div>

        <div class="form-group champ champ--mdp">

          <span class="champ-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.2" r="1"/></svg>
          </span>

          <label for="password">Mot de passe</label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Entrez votre mot de passe"
            required
          >

          <button
            type="button"
            id="mdp-oeil"
            class="champ-oeil"
            data-etat="masque"
            aria-controls="password"
            aria-label="Afficher le mot de passe"
          >
            <svg class="oeil-ouvert" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="oeil-barre" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18"/><path d="M10.6 5.7A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3.2 4"/><path d="M6.5 7.4C4 9 2.5 12 2.5 12S6 18.5 12 18.5c1.5 0 2.8-.4 4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>

        </div>

        <a
          href="mot-de-passe-oublie.html"
          id="mot-de-passe-oublie"
          class="connexion-oublie"
        >Mot de passe oublié ?</a>

        <button
          type="submit"
          class="auth-submit connexion-valider"
        >Se connecter</button>

        <p
          id="connexion-message"
          class="auth-message"
          aria-live="polite"
        ></p>

      </form>

      <p class="connexion-pied">
        Pas encore de compte ?
        <a href="inscription.html">Créer un compte</a>
      </p>

      <a
        href="index.html"
        class="auth-back"
      >
        ← Retour à la boutique
      </a>

    </section>

  </main>

  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration Supabase -->

  <script src="supabase-config.js"></script>

  <!-- Client Supabase -->

  <script src="supabase-client.js"></script>

  <!-- Connexion -->

  <script src="connexion.js"></script>

  <!-- Affichage du mot de passe (interface seulement) -->

  <script src="connexion-ui.js"></script>

</body>

</html>
